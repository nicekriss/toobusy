[project]
name = "toobusy"
description = "toobusy folds tedious multi-step ComfyUI workflows into single production nodes."
version = "0.3.9"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "너무바쁜베짱이 (toobusy)" }]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "comfyui-custom-nodes",
    "workflow",
    "fold",
    "pre-production",
    "storyboard",
    "keyframe",
    "shot-planning",
    "prompt",
    "ideogram",
    "layout",
    "ltx",
    "ltx-video",
    "z-image",
    "video",
    "direction",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Repository = "https://github.com/nicekriss/toobusy"
"Bug Tracker" = "https://github.com/nicekriss/toobusy/issues"

[tool.comfy]
PublisherId = "neobabae"
DisplayName = "toobusy · 너무바쁜베짱이"
Repository = "https://github.com/nicekriss/toobusy"
